max-files-changed: 100

documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

enhancement:
  - changed-files:
      - any-glob-to-any-file:
          - "client/src/**"
          - "server/**"
          - "shared/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "pnpm-lock.yaml"
          - ".github/dependabot.yml"

