name: Codacy Security Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "27 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          run-docker-tools: true

      - name: Validate SARIF output
        shell: bash
        run: |
          if [ ! -s results.sarif ]; then
            echo "::error::Codacy did not produce a SARIF report."
            exit 1
          fi
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('results.sarif','utf8')); if(s.version!=='2.1.0'||!Array.isArray(s.runs)||s.runs.length===0) { console.error('SARIF must be version 2.1.0 and contain at least one run'); process.exit(1); }"

      - name: Assign unique SARIF categories
        shell: bash
        run: |
          sudo chown "$(id -u):$(id -g)" results.sarif
          chmod u+w results.sarif
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('results.sarif', 'utf8'));
          report.runs = report.runs.map((run, index) => {
            run.automationDetails = {
              ...(run.automationDetails || {}),
              id: `codacy/${run.tool?.driver?.name || 'tool'}-${index + 1}`
            };
            return run;
          });
          fs.writeFileSync('results.sarif', JSON.stringify(report));
          NODE

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
