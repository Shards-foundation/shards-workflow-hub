name: Reusable Security - Python Dependency Audit
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      requirements-file:
        description: Requirements file to audit; leave empty to audit the environment
        type: string
        required: false
        default: requirements.txt
      install-command:
        description: Install the project dependencies when requirements-file is empty
        type: string
        required: false
        default: "python -m pip install -e ."
      working-directory:
        description: Project directory
        type: string
        required: false
        default: "."
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Install project for environment audit
        if: inputs.requirements-file == ''
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Audit dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [ -n "$REQUIREMENTS_FILE" ]; then
            python -m pip_audit --strict --requirement "$REQUIREMENTS_FILE"
          else
            python -m pip_audit --strict
          fi
