name: Reusable Security - Python Dependency Audit
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version
        type: string
        required: false
        default: "3.12"
      requirements-file:
        description: Requirements file to audit; leave empty to audit the environment
        type: string
        required: false
        default: requirements.txt
      working-directory:
        description: Project directory
        type: string
        required: false
        default: "."
permissions:
  contents: read
concurrency:
  group: python-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [ -n "$REQUIREMENTS_FILE" ]; then
            python -m pip_audit --strict --requirement "$REQUIREMENTS_FILE"
          else
            python -m pip_audit --strict
          fi
