name: Reusable CI - Java
on:
  workflow_call:
    inputs:
      java-version:
        description: JDK version
        type: string
        required: false
        default: "21"
      distribution:
        description: JDK distribution supported by setup-java
        type: string
        required: false
        default: temurin
      build-tool:
        description: Build tool, either maven or gradle
        type: string
        required: false
        default: maven
      working-directory:
        description: Java project directory
        type: string
        required: false
        default: "."
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.distribution }}
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool }}
      - name: Validate build tool
        env:
          BUILD_TOOL: ${{ inputs.build-tool }}
        run: |
          case "$BUILD_TOOL" in
            maven|gradle) ;;
            *) echo "Unsupported build-tool: $BUILD_TOOL"; exit 1 ;;
          esac
      - name: Test with Maven
        if: inputs.build-tool == 'maven'
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Test with Gradle
        if: inputs.build-tool == 'gradle'
        run: ./gradlew --no-daemon check
