name: Validate GitHub Actions workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/**"
      - ".github/labeler.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint workflow syntax and expressions
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: "true"
