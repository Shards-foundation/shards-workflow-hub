name: Reusable CI - Helm
on:
  workflow_call:
    inputs:
      chart-directory:
        description: Path to the Helm chart
        type: string
        required: false
        default: ./chart
      values-file:
        description: Optional Helm values file path
        type: string
        required: false
        default: ""
      helm-version:
        description: Helm version
        type: string
        required: false
        default: v3.16.4
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ inputs.helm-version }}
      - name: Fetch declared Helm chart dependencies
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
        run: helm dependency build "$CHART_DIRECTORY"
      - name: Lint chart
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          args=()
          if [ -n "$VALUES_FILE" ]; then args=(-f "$VALUES_FILE"); fi
          helm lint "$CHART_DIRECTORY" "${args[@]}"
      - name: Render chart templates
        env:
          CHART_DIRECTORY: ${{ inputs.chart-directory }}
          VALUES_FILE: ${{ inputs.values-file }}
        run: |
          args=()
          if [ -n "$VALUES_FILE" ]; then args=(-f "$VALUES_FILE"); fi
          helm template workflow-validation "$CHART_DIRECTORY" --debug "${args[@]}"
