name: Gitleaks

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    permissions:
      contents: read
    uses: Shards-foundation/.github/.github/workflows/gitleaks.yml@ed2058b1f36bfefa1ce847ff253c777f3df8cd5b # main
