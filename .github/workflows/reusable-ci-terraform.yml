name: Reusable CI - Terraform
on:
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform CLI version
        type: string
        required: false
        default: "1.9.8"
      working-directory:
        description: Directory containing Terraform configuration
        type: string
        required: false
        default: "."
      lockfile:
        description: Require dependency lock file during init
        type: boolean
        required: false
        default: true
permissions:
  contents: read
concurrency:
  group: terraform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false ${{ inputs.lockfile && '-lockfile=readonly' || '' }}
      - name: Validate configuration
        run: terraform validate -no-color
