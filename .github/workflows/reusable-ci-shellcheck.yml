name: Reusable CI - ShellCheck
on:
  workflow_call:
    inputs:
      scan-directory:
        description: Directory to scan for shell scripts
        type: string
        required: false
        default: .
      severity:
        description: Minimum issue severity (error, warning, info, style)
        type: string
        required: false
        default: warning
permissions:
  contents: read
concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ${{ inputs.scan-directory }}
          check_together: true
          severity: ${{ inputs.severity }}
          ignore_paths: .git
