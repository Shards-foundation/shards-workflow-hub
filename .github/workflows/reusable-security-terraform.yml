name: Reusable Security - Terraform Configuration
on:
  workflow_call:
    inputs:
      scan-directory:
        description: Directory to scan for Terraform misconfigurations
        type: string
        required: false
        default: .
      severity:
        description: Comma-separated severity levels that fail the scan
        type: string
        required: false
        default: HIGH,CRITICAL
permissions:
  contents: read
concurrency:
  group: terraform-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-directory }}
          format: table
          exit-code: "1"
          severity: ${{ inputs.severity }}
