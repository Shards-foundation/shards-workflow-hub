name: Reusable CI - Rust
on:
  workflow_call:
    inputs:
      toolchain:
        description: Rust toolchain channel or version
        type: string
        required: false
        default: stable
      working-directory:
        description: Cargo project directory
        type: string
        required: false
        default: "."
      run-clippy:
        description: Run Clippy with warnings denied
        type: boolean
        required: false
        default: true
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: inputs.run-clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked
