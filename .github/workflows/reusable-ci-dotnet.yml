name: Reusable CI - .NET
on:
  workflow_call:
    inputs:
      dotnet-version:
        description: .NET SDK version
        type: string
        required: false
        default: "8.0.x"
      solution:
        description: Concrete solution, project or directory path (no shell globs)
        type: string
        required: false
        default: "."
      verify-format:
        description: Verify formatting with dotnet format
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
      - name: Restore dependencies
        env:
          SOLUTION_PATH: ${{ inputs.solution }}
        run: dotnet restore "$SOLUTION_PATH"
      - name: Verify formatting
        if: inputs.verify-format
        env:
          SOLUTION_PATH: ${{ inputs.solution }}
        run: dotnet format "$SOLUTION_PATH" --verify-no-changes --no-restore
      - name: Run tests
        env:
          SOLUTION_PATH: ${{ inputs.solution }}
        run: dotnet test "$SOLUTION_PATH" --configuration Release --no-restore --verbosity normal
