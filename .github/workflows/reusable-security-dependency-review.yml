name: Reusable Security - Dependency Review
on:
  workflow_call:
    inputs:
      fail-on-severity:
        description: Minimum severity that fails review (low, moderate, high, critical)
        type: string
        required: false
        default: high
permissions:
  contents: read
  pull-requests: read
jobs:
  review:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Review changed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
