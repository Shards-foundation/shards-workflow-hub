name: Reusable CI - Container Build
on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        required: false
        default: .
      dockerfile:
        description: Dockerfile path
        type: string
        required: false
        default: ./Dockerfile
      platforms:
        description: Buildx platforms to validate
        type: string
        required: false
        default: linux/amd64
permissions:
  contents: read
concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: false
          cache-from: type=gha
