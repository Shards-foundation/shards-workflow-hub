name: Reusable CI - Spell Check
on:
  workflow_call:
    inputs:
      files:
        description: Files to check (codespell glob syntax)
        type: string
        required: false
        default: "*.md"
      ignore-words-file:
        description: Optional codespell ignore-words file
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check spelling
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2
        with:
          files: ${{ inputs.files }}
          ignore_words_file: ${{ inputs.ignore-words-file }}
