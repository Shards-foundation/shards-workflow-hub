name: Reusable Security - Node Dependency Audit
on:
  workflow_call:
    inputs:
      package-manager:
        description: npm, pnpm, or yarn
        type: string
        required: false
        default: npm
      severity:
        description: Minimum severity level passed to npm audit
        type: string
        required: false
        default: high
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Enable pnpm when requested
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Validate package manager
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm|yarn) ;;
            *) echo "Unsupported package manager: $PACKAGE_MANAGER"; exit 1 ;;
          esac
      - name: Audit dependencies
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          SEVERITY: ${{ inputs.severity }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm audit --audit-level="$SEVERITY" ;;
            pnpm) pnpm audit --audit-level "$SEVERITY" ;;
            yarn)
              corepack enable
              YARN_VERSION="$(yarn --version)"
              if [[ "$YARN_VERSION" == 1.* ]]; then
                yarn audit --level "$SEVERITY"
              else
                yarn npm audit --all --recursive --severity "$SEVERITY"
              fi
              ;;
          esac
