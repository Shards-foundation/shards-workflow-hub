name: Reusable CI - Markdown
on:
  workflow_call:
    inputs:
      config-file:
        description: Optional markdownlint-cli2 config path
        type: string
        required: false
        default: ""
      globs:
        description: Quoted file glob passed to markdownlint-cli2
        type: string
        required: false
        default: "**/*.md"
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20
        with:
          config: ${{ inputs.config-file }}
          globs: ${{ inputs.globs }}
