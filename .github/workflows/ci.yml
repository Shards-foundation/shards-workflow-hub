name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reusable-workflows:
    name: Validate reusable workflow catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Run catalog tests
        run: |
          python3 scripts/test-reusable-workflows.py
          python3 scripts/test_automations.py

  ci:
    uses: ./.github/workflows/reusable-ci-node.yml
    with:
      node-version: "22"
      package-manager: pnpm
      lint-script: ""
      typecheck-script: check
      # This repository does not yet contain a unit-test suite.
      test-script: ""
      build-script: build
