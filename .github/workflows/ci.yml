name: CI

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reusable-workflows:
    name: Validate automation catalog (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check Python source compilation
        run: python -m compileall -q scripts/automations scripts/test_automations.py scripts/test-reusable-workflows.py
      - name: Run catalog tests
        run: |
          python scripts/test-reusable-workflows.py
          python scripts/test_automations.py

  ci:
    uses: ./.github/workflows/reusable-ci-node.yml
    with:
      node-version: "22"
      package-manager: pnpm
      lint-script: ""
      typecheck-script: check
      # This repository does not yet contain a unit-test suite.
      test-script: ""
      build-script: build
