name: Reusable CI - GitHub Actions Lint
on:
  workflow_call:
    inputs:
      fail-level:
        description: Minimum reviewdog finding severity that fails
        type: string
        required: false
        default: error
permissions:
  contents: read
concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint workflow syntax and expressions
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1
        with:
          reporter: github-check
          fail_level: ${{ inputs.fail-level }}
