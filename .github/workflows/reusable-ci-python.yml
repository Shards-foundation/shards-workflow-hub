name: Reusable CI - Python
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version or version range accepted by setup-python
        type: string
        required: false
        default: "3.12"
      install-command:
        description: Optional dependency installation command
        type: string
        required: false
        default: "python -m pip install -e '.[dev]'"
      test-command:
        description: Test command
        type: string
        required: false
        default: "python -m pytest"
      lint-command:
        description: Optional lint command; empty disables linting
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory containing the Python project
        type: string
        required: false
        default: "."
permissions:
  contents: read
jobs:
  validate:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/**/requirements*.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install project dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"
      - name: Run lint
        if: inputs.lint-command != ''
        env:
          LINT_COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$LINT_COMMAND"
      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
