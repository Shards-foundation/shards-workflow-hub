name: Microsoft Defender For Devops

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "44 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  MSDO:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1.6.0
        id: msdo
        with:
          # ESLint is excluded here because the current MSDO bundled ESLint
          # configuration ignores every JS/TS file in this repository. TypeScript
          # checks and tests are validated by the project's own CI instead.
          tools: antimalware,checkov,templateanalyzer

      - name: Validate SARIF output
        shell: pwsh
        env:
          SARIF_FILE: ${{ steps.msdo.outputs.sarifFile }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SARIF_FILE) -or !(Test-Path $env:SARIF_FILE) -or (Get-Item $env:SARIF_FILE).Length -eq 0) {
            Write-Error "Microsoft Security DevOps did not produce a SARIF report."
            exit 1
          }

      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
