name: Reusable CI - PHP
on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version
        type: string
        required: false
        default: "8.3"
      extensions:
        description: PHP extensions to install
        type: string
        required: false
        default: none
      test-command:
        description: Test command run after Composer install
        type: string
        required: false
        default: composer test
      working-directory:
        description: Directory containing composer.json
        type: string
        required: false
        default: "."
permissions:
  contents: read
concurrency:
  group: php-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.extensions }}
          tools: composer:v2
          coverage: none
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
