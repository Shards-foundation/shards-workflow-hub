name: Reusable CI - Python Package
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used to build the distribution
        type: string
        required: false
        default: "3.12"
      working-directory:
        description: Python package directory
        type: string
        required: false
        default: "."
      test-command:
        description: Optional command to run tests before packaging
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Run tests
        if: inputs.test-command != ''
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: ${{ inputs.working-directory }}/dist/*
          if-no-files-found: error
          retention-days: 14
